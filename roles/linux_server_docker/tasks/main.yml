---
- name: Install Docker repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Create Docker keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Install Docker apt signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/{{ linux_server_docker_distribution }}/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Configure Docker's official apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/{{ linux_server_docker_distribution }}
    suites: "{{ ansible_facts.distribution_release }}"
    components: stable
    architectures: "{{ ansible_facts.architecture | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }}"
    signed_by: /etc/apt/keyrings/docker.asc
    state: present
  become: true

- name: Install Docker Engine and Compose v2
  ansible.builtin.apt:
    name:
      - containerd.io
      - docker-buildx-plugin
      - docker-ce
      - docker-ce-cli
      - docker-compose-plugin
    state: present
    update_cache: true
  become: true

- name: Configure Docker daemon safeguards
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: Restart Docker
  become: true

- name: Enable Docker at boot
  ansible.builtin.systemd_service:
    name: docker.service
    enabled: true
    state: started
  become: true

- name: Allow the server administrator to use Docker without sudo
  ansible.builtin.user:
    name: "{{ linux_server_admin_user }}"
    groups: docker
    append: true
  become: true
