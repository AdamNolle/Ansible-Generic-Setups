---
# Handlers restart the UI service that renders a changed preference so the new
# value shows immediately. killall returns non-zero when the process is not
# running (e.g. Finder relaunches itself), which is harmless here, and the
# restart is a refresh side effect — the osx_defaults task already reports the
# actual change — so these are marked changed_when: false.

- name: Restart Dock
  ansible.builtin.command: killall Dock
  changed_when: false
  failed_when: false

- name: Restart Finder
  ansible.builtin.command: killall Finder
  changed_when: false
  failed_when: false

- name: Restart SystemUIServer
  ansible.builtin.command: killall SystemUIServer
  changed_when: false
  failed_when: false

# Since macOS 11 the menu-bar clock is rendered by ControlCenter, not
# SystemUIServer, so clock defaults notify this handler instead.
- name: Restart ControlCenter
  ansible.builtin.command: killall ControlCenter
  changed_when: false
  failed_when: false
