---
- name: Configure NVIDIA Container Toolkit
  when: linux_server_gpu_enabled | bool
  block:
    - name: Verify that the NVIDIA driver is already working
      ansible.builtin.command: nvidia-smi
      changed_when: false
      become: true

    - name: Install NVIDIA Container Toolkit signing key
      ansible.builtin.shell: |
        set -o pipefail
        curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey \
          | gpg --dearmor --yes -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
      args:
        creates: /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
        executable: /bin/bash
      become: true

    - name: Configure NVIDIA Container Toolkit apt repository
      ansible.builtin.shell: |
        set -o pipefail
        curl -fsSL https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list \
          | sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#' \
          > /etc/apt/sources.list.d/nvidia-container-toolkit.list
      args:
        creates: /etc/apt/sources.list.d/nvidia-container-toolkit.list
        executable: /bin/bash
      become: true

    - name: Install NVIDIA Container Toolkit
      ansible.builtin.apt:
        name: nvidia-container-toolkit
        state: present
        update_cache: true
      become: true

    - name: Configure NVIDIA as a Docker runtime
      ansible.builtin.command: nvidia-ctk runtime configure --runtime=docker
      changed_when: false
      become: true

    - name: Restart Docker after NVIDIA runtime configuration
      ansible.builtin.systemd_service:
        name: docker.service
        state: restarted
      become: true

    - name: Verify NVIDIA runtime tooling
      ansible.builtin.command: nvidia-container-cli --version
      changed_when: false
      become: true
