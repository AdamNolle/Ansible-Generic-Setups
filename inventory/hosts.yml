---
# Inventory for Ansible-Generic-Setups.
#
# The simplest flow is to run this ON the machine you're setting up:
#   - macOS  → run on the Mac         (localhost, connection: local)
#   - Linux  → run on the Linux box   (localhost, connection: local)
#   - Windows → Windows can't run Ansible itself. Provision it OVER SSH from a
#     control node (a Mac/Linux box, or WSL on the same PC). Enable the OpenSSH
#     server on the target first (see bootstrap/windows.ps1), then fill in the
#     host block below and run `--limit windows`.

all:
  children:
    mac:
      hosts:
        localhost:
          ansible_connection: local

    linux:
      hosts:
        localhost:
          ansible_connection: local

    windows:
      hosts:
        winpc:
          # --- edit these for the target PC, then run: --limit windows -K ---
          ansible_host: 192.168.1.50
          ansible_user: SET_ME               # the Windows account name
          ansible_connection: ssh
          ansible_shell_type: powershell
          ansible_ssh_private_key_file: ~/.ssh/id_ed25519
