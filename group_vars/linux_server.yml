---
# Linux server / homelab profile. Copy this file into group_vars for your own
# inventory and set only values that belong to that host. These defaults are
# deliberately conservative: they never format a drive, expose a port, prune
# Docker data, or deploy a compose project without an explicit opt-in.

linux_server_timezone: UTC
linux_server_admin_user: "{{ ansible_user_id }}"
linux_server_data_root: /srv/homeserver
# Pop!_OS uses Ubuntu's Docker packages; override this only for a supported
# Debian-family derivative with a different Docker repository path.
linux_server_docker_distribution: >-
  {{ 'ubuntu' if ansible_facts.distribution in ['Ubuntu', 'Pop!_OS'] else 'debian' }}

# Existing filesystems only. The storage role accepts UUIDs, creates a safe
# mount point, records it in fstab, and mounts it. It does *not* partition or
# format a device. Find UUIDs with: lsblk -f
#
# Example:
# linux_server_storage_mounts:
#   - name: backup
#     uuid: 70cbde53-dbba-4d40-9ec3-9b771a18c15d
#     path: /mnt/backup
#     fstype: ext4
#     options: defaults,nofail,x-systemd.device-timeout=10
linux_server_storage_mounts: []

# GPU containers are optional. Install the NVIDIA driver through the vendor or
# distribution package manager first, then enable this to add the container
# runtime and verify nvidia-smi before Docker is configured to use it.
linux_server_gpu_enabled: false

# Keep the host closed by default. If enabled, UFW preserves SSH access first,
# then permits only the explicitly listed TCP ports.
linux_server_firewall_enabled: false
linux_server_ssh_port: 22
linux_server_allowed_tcp_ports: []

# Docker is installed from Docker's official apt repository. All compose
# projects should live in their own source directory on the controller, with
# their secrets in Ansible Vault or another secret manager, never in git.
#
# Example:
# linux_server_compose_projects:
#   - name: jellyfin
#     source: ./private-services/jellyfin
#     compose_files:
#       - docker-compose.yml
#   - name: ollama
#     source: ./private-services/ollama
#     compose_files:
#       - docker-compose.yml
linux_server_compose_projects: []
linux_server_service_network_name: services
linux_server_create_service_network: true
# In addition to Docker restart policies, create a small systemd unit for each
# declared Compose project. This gives every stack a deterministic `compose up
# -d` recovery path after boot or a power outage (including one-shot helpers
# that intentionally do not use a restart policy).
linux_server_compose_manage_boot: true

# Linux already uses otherwise-idle RAM as filesystem cache, so high
# `buff/cache` is useful memory rather than waste. Set this opt-in tuning on
# high-memory servers when you want to prefer resident memory over swap/zram.
# Leave it disabled for small-memory hosts or hosts with a deliberate custom
# sysctl policy.
linux_server_memory_tuning_enabled: false
linux_server_memory_sysctls:
  vm.swappiness: "10"
  vm.vfs_cache_pressure: "50"
  vm.max_map_count: "262144"
  fs.file-max: "2097152"

# Safe maintenance defaults. Image pruning is disabled until explicitly opted
# in; it never prunes volumes, but it can remove cached images.
linux_server_enable_docker_prune: false
linux_server_docker_prune_age: 168h
linux_server_healthcheck_interval: hourly
